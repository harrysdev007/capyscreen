<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DogeScope — Such memes. Much wow.</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=39">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/dogescope-32.png?v=39">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/dogescope-192.png?v=39">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/dogescope-180.png?v=39">
  <link rel="manifest" href="site.webmanifest?v=39">
  <meta property="og:title" content="DogeScope — Such memes. Much wow.">
  <meta property="og:image" content="assets/dogescope/dogescope-gradient-logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="assets/dogescope/dogescope-gradient-logo.png">
  <meta name="description" content="Such memes. Much wow. Discover and collect only Doge memes with DogeScope.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#303034">
  <link rel="preload" href="assets/fonts/xn7_YHE41ni1AdIRqAuZuw1Bx9mbZk79FO_F.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/V8mQoQDjQSkFtoMM3T6r8E7mF71Q-gOoraIAEj42Vksj.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=39">
  <link rel="stylesheet" href="css/memegle.css?v=39">
  <link rel="stylesheet" href="css/memedex.css?v=39">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('dogescreen.settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/dogescreen.css?v=41">
</head>
<body>
  <div id="terminal-chrome"></div>
  <div id="app" aria-live="polite"></div>
  <footer id="terminal-footer"></footer>
  <div id="toast" class="toast" role="status"></div>
  <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple class="hidden">
  <input id="lens-input" type="file" accept="image/*" class="hidden">
  <input id="import-input" type="file" accept="application/json" class="hidden">
  <noscript><p style="padding:40px;text-align:center;font-family:var(--font)">DogeScope needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js?v=41"></script>
</body>
</html>
